# XcodeGen 설정: GitHub Actions(macOS)에서 `xcodegen generate`로 Xcode 프로젝트를 만든다.
name: JangakAlimi
options:
  bundleIdPrefix: kr.jangak
  deploymentTarget: { iOS: "15.0" }
settings:
  base:
    MARKETING_VERSION: "1.0.25"
    CURRENT_PROJECT_VERSION: "25"
    SWIFT_VERSION: "5.0"
targets:
  JangakAlimi:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: www
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 장학알리미
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ko
        LSRequiresIPhoneOS: true
        UILaunchScreen: { UIColorName: "", UIImageRespectsSafeAreaInsets: true }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [kr.jangak.alimi.refresh]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.jangak.alimi
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 장학알리미
        CODE_SIGN_STYLE: Automatic
