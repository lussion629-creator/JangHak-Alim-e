# 일회용: 강원대 공개 페이지 구조 확인 (robots.txt, 게시판 목록·상세, K-Cloud 로그인 화면)
name: probe-kangwon
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (scholarship-aggregator)"
          for u in https://www.kangwon.ac.kr/robots.txt https://kangwon.ac.kr/robots.txt https://kcloud.kangwon.ac.kr/robots.txt https://dormitory.kangwon.ac.kr/robots.txt; do echo "=== $u"; curl -sSL -m 20 -A "$UA" "$u" | head -c 3000; echo; done
          echo "=== LIST"; curl -sSL -m 20 -A "$UA" "https://www.kangwon.ac.kr/ko/bbs/750/list.do" > l.html; wc -c l.html
          grep -n -i "<form\|<input\|<select\|name=\"search\|<option\|rss" l.html | head -60
          python3 - <<'P'
          import re
          s=open('l.html',encoding='utf-8',errors='replace').read()
          i=s.find('<tbody'); print(s[i:i+4000])
          j=s.find('pstSn=2503'); print('---CARD', s[j-1500:j+800] if j>0 else 'none')
          P
          echo "=== DETAIL"; curl -sSL -m 20 -A "$UA" "https://www.kangwon.ac.kr/ko/bbs/750/detail.do?pstSn=2503" > d.html; wc -c d.html
          python3 - <<'P'
          s=open('d.html',encoding='utf-8',errors='replace').read()
          for k in ('bbs_view','view','내용','첨부','download.do','캠퍼스'):
              i=s.find(k); print('---',k,i)
          i=s.find('캠퍼스'); print(s[max(0,i-2500):i+5000])
          P
          echo "=== KCLOUD"; curl -sSL -m 20 -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148" -c c.txt "https://kcloud.kangwon.ac.kr/login" > k.html; wc -c k.html
          grep -n -i "<form\|<input\|<button\|captcha\|keypad\|nprotect\|transkey\|onclick\|<script src\|login" k.html | head -80
          echo "=== KMOBILE"; curl -sSL -m 20 -A "Mozilla/5.0 (iPhone)" "https://kmobile.kangwon.ac.kr/" | grep -n -i "<form\|<input\|login\|<script src\|location" | head -40
