# 일회용: 건국대 공개 페이지 구조 확인
name: probe-konkuk
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; exec > probe.txt 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          C="curl -sSL -m 25 -A"
          for u in https://www.konkuk.ac.kr/robots.txt https://kuis.konkuk.ac.kr/robots.txt https://portal.konkuk.ac.kr/robots.txt https://kuportal.konkuk.ac.kr/robots.txt https://ecampus.konkuk.ac.kr/robots.txt; do echo "=== $u"; $C "$UA" -w "\n[%{http_code} %{url_effective}]\n" "$u" | head -c 1200; echo; done
          echo "=== RSS"; $C "$UA" "https://www.konkuk.ac.kr/bbs/konkuk/235/rssList.do?row=50" > rss.xml; wc -c rss.xml; head -c 3000 rss.xml; echo
          echo "=== LIST"; $C "$UA" "https://www.konkuk.ac.kr/konkuk/2239/subview.do" > list.html; wc -c list.html
          grep -o 'artclView.do[^"]*' list.html | head -5
          A=$(grep -o '/bbs/konkuk/235/[0-9]*/artclView.do' list.html | head -1); echo "ART=$A"; [ -n "$A" ] && $C "$UA" "https://www.konkuk.ac.kr$A" > art.html; wc -c art.html
          for u in https://kuis.konkuk.ac.kr/ https://portal.konkuk.ac.kr/ https://kuportal.konkuk.ac.kr/ https://ksso.konkuk.ac.kr/; do echo "=== $u"; $C "$UA" -o p.html -w "[%{http_code} %{url_effective}]\n" "$u"; wc -c p.html; grep -n -i "<form\|<input\|<button\|captcha\|location\.\|login\|<iframe\|<frame\|<script src" p.html | cut -c1-260 | head -40; cp p.html "$(echo $u | sed 's#https://##; s#/##g').html"; done
      - if: always()
        run: |
          mkdir -p out && cd out && git init -q && git checkout -q -b probe-out && cp ../probe.txt ../*.html ../rss.xml . 2>/dev/null
          git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
