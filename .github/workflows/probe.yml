# 일회용: 강원대 공개 페이지 구조 확인 (robots.txt, 게시판 목록·상세, K-Cloud 로그인 화면)
name: probe-kangwon
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; exec > probe.txt 2>&1
          UA="Mozilla/5.0 (scholarship-aggregator)"
          # 서강대 서버가 중간 인증서를 보내지 않으므로 인증서의 AIA 주소에서 받아 묶음에 더한다 (검증은 그대로)
          echo | openssl s_client -connect www.sogang.ac.kr:443 -servername www.sogang.ac.kr -showcerts 2>/dev/null > chain.txt
          grep -c "BEGIN CERT" chain.txt; openssl x509 -in chain.txt -noout -subject -issuer -ext authorityInfoAccess
          AIA=$(openssl x509 -in chain.txt -noout -ext authorityInfoAccess | grep -o 'CA Issuers - URI:[^ ]*' | sed 's/CA Issuers - URI://')
          echo "AIA=$AIA"; curl -sSL -m 20 "$AIA" -o inter.der; openssl x509 -inform der -in inter.der -out inter.pem 2>/dev/null || cp inter.der inter.pem
          openssl x509 -in inter.pem -noout -subject -issuer
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          C="curl -sSL -m 25 --cacert bundle.pem -A"
          $C "$UA" "https://www.sogang.ac.kr/api/api/v1/mainKo/BbsData/boardList?pageNum=1&pageSize=3&bbsConfigFk=141" > sglist.json
          python3 -c "import json;d=json.load(open('sglist.json'));print(json.dumps(d['data']['list'][0],ensure_ascii=False)[:3000])"
          $C "$UA" "https://www.sogang.ac.kr/_nuxt/entry.1599b8d9.js" > e.js
          for f in $(grep -o '"[^"]*\.js"' e.js | tr -d '"' | grep -v http | sort -u | head -400); do $C "$UA" "https://www.sogang.ac.kr/_nuxt/${f#./}" 2>/dev/null | grep -o -E 'BbsData/[A-Za-z]+[^"`]{0,60}' ; done | sort -u | head -40
          PK=$(python3 -c "import json;print(json.load(open('sglist.json'))['data']['list'][0]['pkId'])")
          for path in "BbsData/boardView?pkId=$PK" "BbsData/boardView/$PK" "BbsData/view?pkId=$PK" "BbsData/$PK" "BbsData/boardDetail?pkId=$PK"; do echo "-- $path"; $C "$UA" "https://www.sogang.ac.kr/api/api/v1/mainKo/$path" | head -c 1500; echo; done
          echo "=== SAINT"; $C "Mozilla/5.0 (iPhone)" -c sc.txt -o saint.html -w "%{url_effective} %{http_code}\n" "https://saint.sogang.ac.kr/irj/portal"; wc -c saint.html; grep -n -i "<form\|<input\|<button\|captcha\|location\|<script src\|login\|iframe\|logon" saint.html | head -60
      - if: always()
        run: |
          git init -q out && cd out && cp ../*.html ../probe.txt . 2>/dev/null; git checkout -q -b probe-out
          git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
