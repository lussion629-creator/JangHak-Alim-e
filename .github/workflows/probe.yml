# 일회용: 서강대 SAINT 로그인 화면 구조 확인 (공개 화면만)
name: probe-saint
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; exec > probe.txt 2>&1
          echo | openssl s_client -connect saint.sogang.ac.kr:443 -servername saint.sogang.ac.kr -showcerts 2>/dev/null > chain.txt; grep -c "BEGIN CERT" chain.txt
          AIA=$(openssl x509 -in chain.txt -noout -ext authorityInfoAccess | grep -o 'CA Issuers - URI:[^ ]*' | sed 's/CA Issuers - URI://'); echo "AIA=$AIA"
          curl -sSL -m 20 "$AIA" -o inter.der; openssl x509 -inform der -in inter.der -out inter.pem 2>/dev/null || cp inter.der inter.pem
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          C="curl -sSL -m 25 --cacert bundle.pem -c ck.txt -b ck.txt -A"
          echo "=== robots"; $C "$UA" https://saint.sogang.ac.kr/robots.txt | head -c 500; echo
          echo "=== portal"; $C "$UA" -o p.html -w "%{url_effective} %{http_code}\n" https://saint.sogang.ac.kr/irj/portal; wc -c p.html
          grep -n -i "<form\|<input\|<button\|captcha\|logon\|j_user\|j_pass\|<iframe\|location\|action=" p.html | cut -c1-300 | head -80
          echo "=== mobile"; for u in https://saint.sogang.ac.kr/mobile https://m.sogang.ac.kr https://saint.sogang.ac.kr/irj/portal/mobile; do $C "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" -o m.html -w "$u -> %{url_effective} %{http_code}\n" "$u"; wc -c m.html; done
      - if: always()
        run: |
          mkdir -p out && cd out && git init -q && git checkout -q -b probe-out && cp ../probe.txt ../p.html . 2>/dev/null
          git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
