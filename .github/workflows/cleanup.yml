# 일회용: 확인용으로 만든 임시 브랜치 지우기
name: cleanup-branches
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for b in probe-out ios-build; do
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" --delete "$b" || true
          done
