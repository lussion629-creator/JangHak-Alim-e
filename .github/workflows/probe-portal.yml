# 안드로이드 앱이 실제로 켜지는지 에뮬레이터로 확인 (손으로만 실행). 테스트용 임시 키로 서명하고 APK 는 어디에도 올리지 않는다.
name: probe-portal
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - name: 빌드 도구 준비
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); PL=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)
          echo "build-tools $BT platform $PL"
          mkdir -p android/tools && cp $BT/aapt2 android/tools/ && cp $BT/lib/d8.jar $BT/lib/apksigner.jar android/tools/ && cp $PL/android.jar android/tools/
      - name: APK 빌드 (테스트 키)
        run: cd android && KEYSTORE=$RUNNER_TEMP/test.jks KEYSTORE_PASS=smoketest123 VERSION=smoke bash build.sh
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터에서 실행
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r jangak-alimi-smoke.apk
            adb shell pm grant kr.jangak.alimi android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am start -W -n kr.jangak.alimi/.MainActivity
            sleep 30
            python3 .github/ci/ui.py tap "시작하기" 10 || true
            sleep 2
            python3 .github/ci/ui.py tap "^내 정보$" 10 || true
            sleep 3
            python3 .github/ci/ui.py tapscroll "우리 학교 장학도 보기" 10 || true
            sleep 4
            adb exec-out screencap -p > shot1.png
            python3 .github/ci/ui.py tap "portal.학교" 10 || true
            sleep 3
            python3 .github/ci/ui.py tap "portal.학교" 3 || true
            sleep 3
            adb shell input text 'https://www.konkuk.ac.kr/bbs/konkuk/235/artclList.do'
            sleep 3
            adb exec-out screencap -p > shot1b.png
            adb shell input keyevent 4
            sleep 2
            python3 .github/ci/ui.py tapscroll "^연결하기$" 6 || true
            sleep 25
            adb exec-out screencap -p > shot2.png
            python3 .github/ci/ui.py tap "이 화면 저장" 10 || true
            sleep 20
            adb exec-out screencap -p > shot3.png
            python3 .github/ci/ui.py find "건 \\(모집" 5 > found.txt || true
            adb shell uiautomator dump /sdcard/ui.xml; adb shell cat /sdcard/ui.xml > ui.xml
            sleep 2
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > shot.png
            adb shell dumpsys activity top | head -40 > top.txt
            adb shell pidof kr.jangak.alimi > pid.txt || echo none > pid.txt
      - if: always()
        run: |
          mkdir -p out && cd out && git init -q && git checkout -q -b probe-out
          cp ../logcat.txt ../shot*.png ../top.txt ../pid.txt ../found.txt ../ui.xml . 2>/dev/null || true
          grep -E "AndroidRuntime|FATAL|jangak|chromium|Console" ../logcat.txt | head -300 > filtered.txt 2>/dev/null || true
          git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m smoke || true
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
